name: Backend CI Pipeline

on:
  workflow_dispatch: # Let me click the button to run it manually
  pull_request:
    branches:
      - main
    paths:
      - 'starter/backend/**' # Only run if changes are inside this folder

jobs:
  # Job 1: Check code formatting/quality
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Grab the code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: |
          cd starter/backend
          pip install pipenv
      
      - name: Install dependencies
        run: |
          cd starter/backend
          pipenv install --dev

      - name: Run Linting
        run: |
          cd starter/backend
          pipenv run lint

  # Job 2: Run test suite (happens at the exact same time as lint)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Grab the code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: |
          cd starter/backend
          pip install pipenv
      
      - name: Install dependencies
        run: |
          cd starter/backend
          pipenv install --dev

      - name: Run Tests (CI Mode)
        run: |
          cd starter/backend
          pipenv run test

  # Job 3: Try building the Docker image (only runs if lint + test pass)
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Grab the code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t backend-ci ./starter/backend
